services:
  - type: web
    name: budgetfitzz-strategy-lab
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: python --version
    startCommand: python app/server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
