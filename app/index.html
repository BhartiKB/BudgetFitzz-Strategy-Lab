<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ea">
  <meta name="description" content="BudgetFitzz editorial creator workspace for evidence-led social strategy.">
  <title>BudgetFitzz — Editorial Creator Atelier</title>
  <link rel="stylesheet" href="tokens.css?v=12.0">
  <link rel="stylesheet" href="styles.css?v=12.0">
  <link rel="stylesheet" href="responsive.css?v=12.0">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">
    <aside class="app-rail" aria-label="Primary navigation">
      <a class="brand" href="#home" aria-label="BudgetFitzz home">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span><strong>BudgetFitzz</strong><small>Editorial atelier</small></span>
      </a>
      <nav id="desktop-nav" class="route-nav" aria-label="Workspace routes"></nav>
      <div id="rail-status" class="rail-status" aria-live="polite"></div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <a class="mobile-brand" href="#home" aria-label="BudgetFitzz home"><span aria-hidden="true">B</span> BudgetFitzz Atelier</a>
        <p id="route-context" class="route-context">Editorial creator workspace</p>
        <div id="topbar-status" class="topbar-status" aria-live="polite"></div>
      </header>

      <main id="main-content" class="route-stage" tabindex="-1">
        <div class="loading-state" role="status" aria-live="polite">
          <span class="loading-state__mark" aria-hidden="true"></span>
          <div><strong>Opening the atelier</strong><p>Loading the generated strategy manifest…</p></div>
        </div>
      </main>
    </div>
  </div>

  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>

  <dialog id="route-sheet" class="sheet-dialog" aria-labelledby="route-sheet-title">
    <div class="dialog-head"><div><span class="overline">WORKSPACE</span><h2 id="route-sheet-title">All routes</h2></div><button class="icon-button" data-close-dialog="route-sheet" aria-label="Close routes">×</button></div>
    <nav id="sheet-nav" class="sheet-nav" aria-label="All workspace routes"></nav>
  </dialog>

  <dialog id="preview-modal" class="preview-dialog" aria-labelledby="preview-title">
    <div id="preview-content"></div>
  </dialog>

  <script src="app.js?v=12.3"></script>
</body>
</html>
