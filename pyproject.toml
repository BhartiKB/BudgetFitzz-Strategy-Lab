[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-strategy-lab"
version = "1.0.0"
description = "Offline agentic performance analysis and strategy revision platform for BudgetFitzz"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.1",
  "pandas==2.3.1",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "reportlab==4.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

